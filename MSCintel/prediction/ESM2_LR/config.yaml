# ============================================================
# ESM2-LR prediction configuration
# ============================================================

prediction:
  input_fasta: Data/input.fasta
  output: outputs/predictions.csv

  # Optional directory containing existing per-sequence .npy embeddings.
  # Set to null to generate embeddings using ESM2.
  embedding_dir: outputs/embeddings

  # Optional local ESM2 checkpoint.
  # Used only when embedding_dir is null.
  # Set to null to automatically download/load esm2_t33_650M_UR50D.
  esm_model_path: null

  # Probability threshold for binary prediction.
  threshold: 0.5

  # Whether to save newly generated sequence-level ESM2 embeddings.
  # This option is ignored when embedding_dir is provided.
  save_embeddings: false
  embedding_output_dir: outputs/embeddings